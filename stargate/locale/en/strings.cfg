[mod-name]
bte-stargate=Beyond the Edge: Stargate

[mod-description]
bte-stargate=Adds a Stargate: an experimental construction site that turns a delivery of rare materials into a gate.

[entity-name]
bte-stargate-construction-site=Stargate construction site
bte-stargate-construction-kit=Stargate construction kit
bte-stargate-assembling=Stargate under construction
bte-stargate=Stargate
bte-stargate-side-block=Stargate machinery
bte-stargate-cabinet-block=Stargate control cabinet
bte-stargate-rack-block=Stargate capacitor rack
bte-stargate-station=Stargate station

[entity-description]
bte-stargate-assembling=The delivered materials are being raised into a Stargate. It cannot be opened or mined, only destroyed.
bte-stargate-construction-site=A foundation for a Stargate. Fill it with the materials listed below. Each slot holds exactly what a gate needs. Once the full amount is inside, the delivery is consumed and the gate is built over the next minute.
bte-stargate=A steel ring between two support towers, standing in a concrete basin. Pair it with another gate, power it, and walk through the ring to arrive in front of the other gate. It cannot be mined or deconstructed, only destroyed.

[item-name]
bte-stargate-construction-kit=Stargate construction kit

[item-description]
bte-stargate-construction-kit=Places a Stargate construction site. Holds the scarce high-end parts of the gate; the bulk materials are delivered to the site.

[recipe-name]
bte-stargate-construction-kit=Stargate construction kit
bte-stargate-portal=Open portal

[technology-name]
bte-stargate-experimental-gates=Experimental gates
bte-stargate-controlled-jumps=Controllable Stargate jumps
bte-stargate-rail-transit=Stargate rail transit

[technology-description]
bte-stargate-experimental-gates=Unlocks the Stargate construction kit. Deliver its materials to the construction site to raise an experimental Stargate that opens to an unexplored spot on a visited planet.
bte-stargate-controlled-jumps=Calibrates Stargates to lock onto a chosen partner gate on the same planet or another world. Becomes available once you have travelled through an open, unpaired Stargate, on foot or in a vehicle.
bte-stargate-rail-transit=Equips paired Stargates with ramped station rails and signal interlocks so trains can pass between worlds.

[bte-stargate-technology]
controlled-jumps-effect=Unlocks Stargate pairing across surfaces
rail-transit-effect=Unlocks Stargate train station mode

[bte-stargate-construction]
requirements=Required materials:

[bte-stargate-gui]
name=Name
partner=Paired gate
partner-tooltip=The gate this one sends to. Pairing works both ways: the chosen gate is paired back to this one, and any earlier pairs of either gate are broken. With none, the gate sends you to the unexplored area closest to the landing site of a random planet you have visited.
partner-locked-tooltip=Travel through an unpaired gate, then research [font=default-bold][technology=bte-stargate-controlled-jumps] Controllable Stargate jumps[/font] to pair gates.
pair-locked=Research Controllable Stargate jumps first
transfer-in-progress=A train is currently passing through the gate
no-partner=None: random destination
enabled=Engage gate
enabled-tooltip=Lets the gate dial out and open once fully charged. Untick to shut it down. With a red or green wire connected, a circuit condition appears below; once a signal is chosen, the gate stays closed while the condition is false.
keep-charged=Keep charged when disengaged
keep-charged-tooltip=The gate's capacitors lose 0.5 % of their charge a second, 50 MW when full. A gate disengaged or closed by its circuit condition normally stops charging and runs down; with this set it keeps charging, so it opens as soon as it is engaged again.
circuit=Engage when
circuit-tooltip=Choose a signal to engage the gate only while the condition is true. With no signal chosen, the wire is ignored.
status-open=Open: walk through the ring to travel
status-off=Disengaged
status-open-random=Open: leads somewhere unexplored on a planet you have visited
status-nowhere=Open, but there is no planet to send you to
status-circuit=Closed by circuit condition
status-charging=Charging: needs a full charge to open
status-frozen=Frozen: keep it warm with heat pipes (1 MW) to charge and open it. It still receives travellers.
status-draining=Open, but short of power: closes when the charge runs out
status-open-no-trains=Open, but trains wait: the paired gate is not a station
status-open-unpaired-station=Open: leads somewhere random; trains wait until paired with a station gate
station=Train station
station-tooltip=Lays rails through the gate up to the ring and adds a station named after the gate. A train that reaches the gate's edge on the departure lane, on its way to the station or driven in by hand, comes out of the paired gate's arrival lane carriage by carriage, then carries on with its schedule past this station. Both gates must be stations. Not while a train is on the gate's rails.
station-locked-tooltip=Research [font=default-bold][technology=bte-stargate-rail-transit] Stargate rail transit[/font] to set up gates as train stations.
station-locked=Research Stargate rail transit first
station-off=Off
station-single=Single track, bidirectional
station-right=Double track, right-hand running
station-left=Double track, left-hand running
station-single-explanation=Trains run both ways on one track through the centre of the gate: in to the ring [color=#60dc60]▲[/color], and out of it from the paired gate [color=#ffb030]▼[/color]. A train is not sent here while another stands on the track.
station-right-explanation=Trains keep to the right, as seen by the driver. They drive in to the ring on the right-hand track [color=#60dc60]▲[/color]. Trains from the paired gate come out on the other track [color=#ffb030]▼[/color].
station-left-explanation=Trains keep to the left, as seen by the driver. They drive in to the ring on the left-hand track [color=#60dc60]▲[/color]. Trains from the paired gate come out on the other track [color=#ffb030]▼[/color].
station-occupied=A train is on the gate's rails
charge=Capacitors __1__%
watts=__1__ __2__W
power-upkeep=Holding the wormhole open
power-upkeep-tooltip=Network power going into the open wormhole's 1 GW upkeep now. Zero while closed.
power-charging=Charging capacitors
power-charging-tooltip=Network power going into the gate's capacitors now, beyond what the upkeep and the leakage take.
power-leak=Capacitor leakage
power-leak-tooltip=Network power replacing what the capacitors lose on their own, 0.5 % of their charge a second.
charge-tooltip=The gate's capacitors: 10 GJ, charging from spare network power at up to 1 GW and losing 0.5 % of their charge a second (50 MW when full). Dialling needs them full and spends 80 % of the charge to open the wormhole; an open gate then runs its 1 GW upkeep from them while the network refills them.
