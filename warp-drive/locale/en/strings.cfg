detector-help-local=[color=green][font=default-bold]Onboard laboratories detected:[/font][/color] Working laboratories on this platform receive [font=default-bold]100%[/font] of the tachyon signal while [font=default-bold][technology=bte-practical-warp-drive] Practical Warp Drive[/font] is active (removing all labs from this platform switches to remote planetary transfer with a [font=default-bold]10x[/font] data loss).\n\nTachyon density rises from [font=default-bold]10[/font] to [font=default-bold]100[/font] particles/s across the inner system, then climbs steeply along the final route toward __1__ (~[font=default-bold]1,000[/font] particles/s at [font=default-bold]100,000 km[/font] and ~[font=default-bold]5,000[/font] particles/s at [font=default-bold]500,000 km[/font]) before tapering to [font=default-bold]__2__[/font] particles/s there. Speed multiplies that density: [font=default-bold]1[/font]x at rest, plus [font=default-bold]1[/font]x per [font=default-bold]100[/font] km/s. Every [font=default-bold]100 MW[/font] delivered adds another full signal multiplier, up to [font=default-bold]10[/font]x at [font=default-bold]1 GW[/font]. Partial power scales continuously.\n\nFor example, at [font=default-bold]500,000 km[/font] past the Solar System Edge (~[font=default-bold]5,000 particles/s[/font]), [font=default-bold]50 km/s[/font] ([font=default-bold]1.5[/font]x), and [font=default-bold]500 MW[/font] ([font=default-bold]5[/font]x), onboard laboratories receive the full [font=default-bold]~37,500 particles/s[/font] signal: each working laboratory on this platform adds about [font=default-bold]37,500[/font] times its ordinary rate as bonus research.
detector-help-relay=[color=orange][font=default-bold]No laboratories found on this surface — using remote transfer with 10x data loss (0.1x):[/font][/color] Working laboratories on planets receive [font=default-bold]1/10[/font] of the tachyon signal while [font=default-bold][technology=bte-practical-warp-drive] Practical Warp Drive[/font] is active (build laboratories on this platform to eliminate the transfer loss and receive the full [font=default-bold]100%[/font] signal locally).\n\nTachyon density rises from [font=default-bold]10[/font] to [font=default-bold]100[/font] particles/s across the inner system, then climbs steeply along the final route toward __1__ (~[font=default-bold]1,000[/font] particles/s at [font=default-bold]100,000 km[/font] and ~[font=default-bold]5,000[/font] particles/s at [font=default-bold]500,000 km[/font]) before tapering to [font=default-bold]__2__[/font] particles/s there. Speed multiplies that density: [font=default-bold]1[/font]x at rest, plus [font=default-bold]1[/font]x per [font=default-bold]100[/font] km/s. Every [font=default-bold]100 MW[/font] delivered adds another full signal multiplier, up to [font=default-bold]10[/font]x at [font=default-bold]1 GW[/font]. Partial power scales continuously.\n\nFor example, at [font=default-bold]500,000 km[/font] past the Solar System Edge (~[font=default-bold]5,000 particles/s[/font]), [font=default-bold]50 km/s[/font] ([font=default-bold]1.5[/font]x), and [font=default-bold]500 MW[/font] ([font=default-bold]5[/font]x), the raw [font=default-bold]~37,500 particles/s[/font] signal becomes [font=default-bold]~3,750 particles/s[/font] after the 10x remote-transfer loss: each working planetary laboratory adds about [font=default-bold]3,750[/font] times its ordinary rate as bonus research.
