[mod-name]
bte-warp-drive=Warp Drive

[mod-description]
bte-warp-drive=Adds tachyon-assisted deep-space research and accelerated space-platform travel.

[mod-setting-name]
bte-warp-drive-severely-impatient=Severely impatient mode (1,000x tachyon bonus)

[mod-setting-description]
bte-warp-drive-severely-impatient=Multiplies the tachyon research bonus by 1,000. This setting is for severely impatient people and takes effect immediately without restarting the game.

[item-name]
bte-warp-drive=Warp Drive

[item-description]
bte-warp-drive=Detects subspace tachyons for practical warp research, then accelerates its platform through deep space.

[entity-name]
bte-warp-drive=Warp Drive

[entity-description]
bte-warp-drive=One experimental Warp Drive may be installed on each space platform.

[recipe-name]
bte-warp-drive=Warp Drive

[technology-name]
bte-theoretical-warp-drive=Theoretical Warp Drive
bte-practical-warp-drive=Practical Warp Drive

[technology-description]
bte-theoretical-warp-drive=Construct an experimental drive that detects subspace tachyons and accelerates Practical Warp Drive research through eligible laboratories.
bte-practical-warp-drive=Stabilize a traversable subspace field. A powered experimental drive in deep space makes eligible laboratories complete this research dramatically faster.

[bte-warp-drive]
duplicate=Only one Warp Drive may be installed on each space platform.
title=Warp Drive Status
engage=Engage warp drive
engage-tooltip=Charges the warp support reserve, then enters warp. Warp holds until it disengages, reaches endpoint clearance, or loses speed or power; the next jump needs another click or the engage condition.
engage-blocked-warp=Warp is already engaged.
engage-blocked-charging=The drive is already charging for warp entry.
engage-blocked-deactivate=The disengage condition is true and holds the drive off.
engage-blocked-cooldown=Re-entry lockout is active.
engage-blocked-travel=Not ready: the platform must be travelling along a connection.
engage-blocked-speed=Not ready: engine speed must be at least 50 km/s.
engage-blocked-clearance=Not ready: the first and final 1,000 km of a connection are conventional travel.
engage-blocked-locked=The drive is switching to warp mode.
disengage=Disengage
disengage-tooltip=Abandons charging or drops out of warp, starting the usual re-entry lockout. A true engage condition engages again once the lockout ends.
disengage-blocked-idle=The drive is neither charging nor in warp.
start-detector=Start tachyon detector
start-detector-tooltip=Powers the tachyon detector until it is stopped.
start-detector-blocked-running=The tachyon detector is already running.
start-detector-blocked-deactivate=The stop condition is true and holds the detector off.
stop-detector=Stop tachyon detector
stop-detector-tooltip=Switches the tachyon detector off, ending its power draw and research bonus.
stop-detector-blocked-stopped=The tachyon detector is already off.
stop-detector-blocked-activate=The start condition is true and holds the detector on.
activate-condition=Engage if condition
activate-condition-tooltip=While the condition on the combined red and green networks is true, the drive engages whenever every entry requirement is met, as if Engage were clicked. Turning false does not disengage; use the disengage condition for that.
deactivate-condition=Disengage if condition
deactivate-condition-tooltip=While the condition on the combined red and green networks is true, the drive abandons charging or drops out of warp, and cannot be engaged. It takes precedence over the engage condition.
research-detector-start-condition=Start detector if condition
research-detector-start-condition-tooltip=While the condition on the combined red and green networks is true, the tachyon detector runs. It stays on afterwards until stopped.
research-detector-stop-condition=Stop detector if condition
research-detector-stop-condition-tooltip=While the condition on the combined red and green networks is true, the tachyon detector is off. It takes precedence over the start condition and stays off afterwards until started.
detector-start-condition=Start boost if condition
detector-start-condition-tooltip=While the condition on the combined red and green networks is true, the Tachyon Science Boost is switched on. It stays on afterwards until stopped, and runs only while warp is not engaged.
detector-stop-condition=Stop boost if condition
detector-stop-condition-tooltip=While the condition on the combined red and green networks is true, the Tachyon Science Boost is switched off. It takes precedence over the start condition and stays off afterwards until started.
boost-section=Tachyon Science Boost
boost-start=Start boost
boost-start-tooltip=Switches the tachyon detector on. It boosts all research in every laboratory you own while the drive is not engaged, and pauses during charging, warp, and the re-entry lockout.
boost-start-blocked-running=The Tachyon Science Boost is already on.
boost-start-blocked-deactivate=The stop condition is true and holds the boost off.
boost-stop=Stop boost
boost-stop-tooltip=Switches the tachyon detector off, ending its power draw and research boost.
boost-stop-blocked-stopped=The Tachyon Science Boost is already off.
boost-stop-blocked-activate=The start condition is true and holds the boost on.
