theoretical-warp-drive=Construct an experimental drive that detects subspace tachyons and accelerates Practical Warp Drive research through eligible laboratories.
practical-warp-drive=Stabilize a traversable subspace field. A powered experimental drive in deep space makes eligible laboratories complete this research dramatically faster.

