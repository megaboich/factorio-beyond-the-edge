warp-help=After [font=default-bold][technology=practical-warp-drive] Practical Warp Drive[/font] completes, the detector shuts down and the drive begins storing activation charge. Automatic warp enters at Warp-1 with a [font=default-bold]10[/font]x speed boost, then gains approximately one level every [font=default-bold]2[/font] seconds after support power stabilizes. Each level requires [font=default-bold]50[/font] km/s of engine speed and [font=default-bold]20[/font] W/kg of support power. A shortfall lowers the level immediately. Warp level has no scripted maximum. The first and final [font=default-bold]1,000[/font] km remain in normal space. Circuit outputs are W for active warp, C for charge percent, S for effective speed in km/s, and P for detector power percentage relative to 200 MW.
