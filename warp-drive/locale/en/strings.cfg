research-help-section=How Research Works
detector-help-local=Only working laboratories on this platform receive the tachyon bonus while [font=default-bold][technology=practical-warp-drive] Practical Warp Drive[/font] is active.\n\nTachyon density rises with progress toward __1__ and reaches [font=default-bold]__2__[/font] particles/s there. Speed multiplies that density: [font=default-bold]1[/font]x at rest, plus [font=default-bold]1[/font]x per [font=default-bold]100[/font] km/s. Every [font=default-bold]200 MW[/font] delivered adds another full signal multiplier, up to [font=default-bold]5[/font]x at [font=default-bold]1 GW[/font]. Partial power scales continuously.\n\nFor example, without an additional facility bonus, at [font=default-bold]300,000 km[/font] toward Shattered Planet, [font=default-bold]50 km/s[/font], and [font=default-bold]500 MW[/font], the detector produces about [font=default-bold]2,057 particles/s[/font] of effective signal. Each eligible laboratory adds about [font=default-bold]2,057[/font] times its ordinary rate as bonus research.
detector-help-relay=Every working laboratory your force owns receives the tachyon bonus while [font=default-bold][technology=practical-warp-drive] Practical Warp Drive[/font] is active.\n\nTachyon density rises with progress toward __1__ and reaches [font=default-bold]__2__[/font] particles/s there. Speed multiplies that density: [font=default-bold]1[/font]x at rest, plus [font=default-bold]1[/font]x per [font=default-bold]100[/font] km/s. Every [font=default-bold]200 MW[/font] delivered adds another full signal multiplier, up to [font=default-bold]5[/font]x at [font=default-bold]1 GW[/font]. Partial power scales continuously.\n\nFor example, without an additional facility bonus, at [font=default-bold]300,000 km[/font] toward Shattered Planet, [font=default-bold]50 km/s[/font], and [font=default-bold]500 MW[/font], the detector produces about [font=default-bold]2,057 particles/s[/font] of effective signal. Each eligible laboratory adds about [font=default-bold]2,057[/font] times its ordinary rate as bonus research.
detector-help-unknown=Waiting for this drive's platform surface before the tachyon relay mode can be determined.
detector-help-complete=[font=default-bold][technology=practical-warp-drive] Practical Warp Drive[/font] is complete. The tachyon detector is offline; its power system now stores activation charge for warp travel.
