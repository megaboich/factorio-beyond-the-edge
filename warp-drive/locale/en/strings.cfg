boost-value-combined=+[font=default-bold]__1__%[/font] ([font=default-bold]__2__[/font]x)  ·  all drives +[font=default-bold]__3__%[/font] ([font=default-bold]__4__[/font]x)
boost-research-label=Current research
boost-research-none=None selected
boost-help-local=[color=green][font=default-bold]Onboard laboratories detected:[/font][/color] Working laboratories on this platform receive [font=default-bold]100%[/font] of the tachyon signal as a general science boost (removing all labs from this platform switches to remote planetary transfer with a [font=default-bold]10x[/font] data loss).\n\nThe boost uses the same tachyon signal formula as Practical Warp Drive research (density × speed multiplier × power multiplier × relay efficiency) divided by [font=default-bold]10,000 particles/s[/font]. At __1__ ([font=default-bold]__2__[/font] particles/s), [font=default-bold]50 km/s[/font] ([font=default-bold]1.5[/font]x), and [font=default-bold]1 GW[/font] ([font=default-bold]10[/font]x), the effective signal is [font=default-bold]150,000 particles/s[/font], giving onboard laboratories [font=default-bold]+1,500%[/font] ([font=default-bold]16[/font]x) research speed. It runs only while warp is not engaged.
boost-help-relay=[color=orange][font=default-bold]No laboratories found on this surface — using remote transfer with 10x data loss (0.1x):[/font][/color] Working laboratories on planets receive [font=default-bold]1/10[/font] of the tachyon signal as a general science boost (build laboratories on this platform to eliminate the transfer loss and boost onboard labs by up to [font=default-bold]10x[/font] more).\n\nThe boost uses the same tachyon signal formula as Practical Warp Drive research (density × speed multiplier × power multiplier × relay efficiency) divided by [font=default-bold]10,000 particles/s[/font]. At __1__ ([font=default-bold]__2__[/font] particles/s), [font=default-bold]50 km/s[/font] ([font=default-bold]1.5[/font]x), and [font=default-bold]1 GW[/font] ([font=default-bold]10[/font]x), the remote signal is [font=default-bold]15,000 particles/s[/font], giving planetary laboratories [font=default-bold]+150%[/font] ([font=default-bold]2.5[/font]x) research speed per drive. Boosts from multiple remote drives add together, and run only while warp is not engaged.
boost-help-unknown=Waiting for this drive's platform surface before the tachyon relay mode can be determined.
